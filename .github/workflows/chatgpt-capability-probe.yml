name: ChatGPT Capability Probe

on:
  push:
    branches:
      - chatgpt-capability-probe
  pull_request:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Produce probe output
        run: |
          echo "ChatGPT GitHub Actions probe succeeded" > probe-output.txt
          cat probe-output.txt
      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-capability-probe
          path: probe-output.txt
