name: ChatGPT Capability Probe

on:
  pull_request:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Python unit tests when present
        shell: bash
        run: |
          if [[ -f test_probe.py ]]; then
            python -m unittest -v test_probe.py
          else
            echo "No Python probe tests present"
          fi

      - name: Run Go tests when present
        shell: bash
        run: |
          if [[ -f go.mod ]]; then
            go version
            go test -v ./...
          else
            echo "No Go module present"
          fi

      - name: Run Rust tests when present
        shell: bash
        run: |
          if [[ -f Cargo.toml ]]; then
            rustc --version
            cargo --version
            cargo test --verbose
          else
            echo "No Rust crate present"
          fi

      - name: Produce probe output
        run: |
          echo "ChatGPT GitHub Actions probe completed" > probe-output.txt
          cat probe-output.txt

      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-capability-probe
          path: probe-output.txt
          if-no-files-found: ignore
